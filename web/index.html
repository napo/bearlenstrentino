<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>BearLens Trentino</title>
    <meta
      name="description"
      content="Una lente critica sulle segnalazioni di orso in Trentino."
    />

    <!-- Social preview (Open Graph / Twitter Card). og:image needs an
         absolute URL — crawlers fetch it directly, they don't resolve it
         against the page like a browser would. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:site_name" content="BearLens Trentino" />
    <meta property="og:title" content="BearLens Trentino" />
    <meta
      property="og:description"
      content="Una lente critica sulle segnalazioni di orso in Trentino."
    />
    <meta property="og:url" content="https://napo.github.io/bearlenstrentino/" />
    <meta property="og:image" content="https://napo.github.io/bearlenstrentino/social-preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BearLens Trentino" />
    <meta
      name="twitter:description"
      content="Una lente critica sulle segnalazioni di orso in Trentino."
    />
    <meta name="twitter:image" content="https://napo.github.io/bearlenstrentino/social-preview.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
